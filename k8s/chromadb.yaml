# ChromaDB do vector-db dentro do cluster.
#
# Uma replica so: o Deployment aqui serve para manter o Pod de pe e dar a ele
# um endereco estavel, nao para escalar. Sem volume persistente - se o Pod for
# recriado, os embeddings somem e o vector-db reindexaria do zero. Para o
# laboratorio isso basta.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.5.20
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---
# Endereco estavel do Chroma. vector-db usa CHROMA_HOST=chromadb,
# CHROMA_PORT=8000 - e este nome, "chromadb", que precisa bater com o Service
# abaixo.
apiVersion: v1
kind: Service
metadata:
  name: chromadb
spec:
  type: ClusterIP
  selector:
    app: chromadb
  ports:
    - port: 8000
      targetPort: 8000
